name: release
# Pushing a tag like v1.1.0 builds the universal Gremlo dmg, signs the update for Sparkle, and attaches the dmg and
# appcast.xml to that tag's GitHub release. With the Apple secrets it also signs with the Developer ID, notarizes and
# staples; without them (today) the app is ad hoc signed and the notes give the Open Anyway steps. Setup: docs/RELEASE.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build && swift test
        working-directory: apps/mac
      - name: Import the Developer ID certificate into a throwaway keychain, if there is one
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERT_P12" ]; then echo "no Developer ID secrets: ad hoc build, not notarized"; exit 0; fi
          [ -n "$APPLE_CERT_PASSWORD" ] || { echo "APPLE_CERT_P12 is set but APPLE_CERT_PASSWORD is not"; exit 1; }
          kc="$RUNNER_TEMP/signing.keychain-db"; kcpw="$(uuidgen)"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          printf '%s' "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          id="$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          [ -n "$id" ] || { echo "no Developer ID Application identity in APPLE_CERT_P12"; exit 1; }
          echo "SIGN_ID=$id" >> "$GITHUB_ENV"
      - name: Build (signed and notarized only with a Developer ID)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: |
          [ -n "$SPARKLE_PUBLIC_KEY" ] || { echo "repo variable SPARKLE_PUBLIC_KEY is not set (docs/RELEASE.md)"; exit 1; }
          VERSION="${GITHUB_REF_NAME#v}" ./scripts/release-mac.sh
      - name: Sign the update and write the appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          [ -n "$SPARKLE_PRIVATE_KEY" ] || { echo "secret SPARKLE_PRIVATE_KEY is not set (docs/RELEASE.md)"; exit 1; }
          # sign_update from the same pinned Sparkle zip as Package.swift, checked before it ever sees the key
          curl -sSL -o "$RUNNER_TEMP/sparkle.zip" https://github.com/sparkle-project/Sparkle/releases/download/2.10.1/Sparkle-for-Swift-Package-Manager.zip
          echo "4c2e48a3e50ebcc2c88a58a4c7264a1a99c3c31857ce754357afb9cdb323022a  $RUNNER_TEMP/sparkle.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/sparkle.zip" bin/sign_update -d "$RUNNER_TEMP/sparkle"
          v="${GITHUB_REF_NAME#v}"; dmg="apps/mac/dist/Gremlo-$v.dmg"
          # the key goes in on stdin, never as an argument or a file
          sig="$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$RUNNER_TEMP/sparkle/bin/sign_update" --ed-key-file - "$dmg")"
          case "$sig" in *edSignature=*length=*) ;; *) echo "sign_update gave no signature"; exit 1 ;; esac
          cat > apps/mac/dist/appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Gremlo</title>
              <item>
                <title>Gremlo $v</title>
                <pubDate>$(date -u '+%a, %d %b %Y %H:%M:%S +0000')</pubDate>
                <sparkle:version>$v</sparkle:version>
                <sparkle:shortVersionString>$v</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>13.0</sparkle:minimumSystemVersion>
                <sparkle:releaseNotesLink>https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME</sparkle:releaseNotesLink>
                <enclosure url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/Gremlo-$v.dmg" type="application/octet-stream" $sig />
              </item>
            </channel>
          </rss>
          XML
          xmllint --noout apps/mac/dist/appcast.xml
      - name: Attach the dmg to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg="apps/mac/dist/Gremlo-${GITHUB_REF_NAME#v}.dmg"
          shasum -a 256 "$dmg" | sed 's|apps/mac/dist/||' > "$dmg.sha256"
          if [ -n "${SIGN_ID:-}" ]; then
            first="Signed with a Developer ID and notarized by Apple. Open the dmg, drag Gremlo onto Applications, and open it."
          else
            first="$(cat <<'EOF'
          This build isn't notarized: there's no Apple Developer ID behind it. It is ad hoc signed and built by this repo's
          release workflow from the tagged source. macOS will say it can't check it for malware the first time.

          First launch:
          1. Open the dmg and drag Gremlo onto Applications.
          2. Open Gremlo. When macOS says it was not opened, click Done.
          3. Open System Settings, Privacy & Security, scroll to Security, and click Open Anyway next to Gremlo. Confirm with your password, then click Open.

          Or, in Terminal, once: `xattr -dr com.apple.quarantine /Applications/Gremlo.app`

          After that it updates itself: each update is checked against the signing key built into the app.
          EOF
          )"
          fi
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Gremlo $GITHUB_REF_NAME" --notes "Gremlo for macOS 13 or later (Apple silicon and Intel).

          $first

          Or build it on your Mac instead: \`curl -fsSL https://raw.githubusercontent.com/DiveshK007/GREMLO/main/install.sh | bash\`"
          fi
          # the app's feed is releases/latest/download/appcast.xml, so publishing the release publishes the update
          gh release upload "$GITHUB_REF_NAME" "$dmg" "$dmg.sha256" apps/mac/dist/appcast.xml --clobber
      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
