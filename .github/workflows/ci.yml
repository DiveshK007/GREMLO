name: ci
on:
  push:
  pull_request:

jobs:
  contracts-near:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: contracts-near }
      # near-workspaces builds the wasm with the cargo-near CLI, then runs the tests on a local NEAR sandbox
      # pinned release, checksum verified (was a piped installer script)
      - name: install cargo-near 0.22.0
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL -o cargo-near.tar.gz https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-x86_64-unknown-linux-gnu.tar.gz
          echo "9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a  cargo-near.tar.gz" | sha256sum -c -
          tar xzf cargo-near.tar.gz
          install -D -m 755 cargo-near-x86_64-unknown-linux-gnu/cargo-near "$HOME/.cargo/bin/cargo-near"
      - run: cargo test
        working-directory: contracts-near

  contracts-accounts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: contracts-accounts }
      # unit tests only; the factory embeds res/gremlo_purse.wasm (built by build.sh, committed)
      - run: cargo test
        working-directory: contracts-accounts

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/server/package-lock.json }
      - run: npm ci
        working-directory: apps/server
      - run: npm test
        working-directory: apps/server

  brain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
        working-directory: packages/brain

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck && npm test && npm run build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SERVER_URL: https://16-4-100-95.sslip.io # the build refuses to run without it

  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build && swift test
        working-directory: apps/mac
      - run: ./scripts/release-mac.sh # unsigned here; signing and notarization need your Apple secrets

  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/server/Dockerfile -t gremlo-api .
      # secrets and data must never be baked into the image
      - run: docker run --rm --entrypoint sh gremlo-api -c '! test -e /app/apps/server/.env && ! test -e /app/apps/server/data.json'
