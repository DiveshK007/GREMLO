name: ci
on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: v1.5.1 } # pinned: resolving "latest" kept failing with GitHub 504s
      - run: forge test
        working-directory: contracts

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: apps/server/package-lock.json }
      - run: npm ci
        working-directory: apps/server
      - run: npm test
        working-directory: apps/server

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: v1.5.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: apps/server/package-lock.json }
      - run: forge build
        working-directory: contracts
      - run: npm ci
        working-directory: apps/server
      - run: |
          anvil --silent &
          for i in $(seq 30); do cast block-number >/dev/null 2>&1 && break; sleep 1; done
          node --import tsx e2e/flow.ts
        working-directory: apps/server

  brain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm test
        working-directory: packages/brain

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck && npm run build
        working-directory: apps/web

  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build
        working-directory: apps/mac
      - run: ./scripts/release-mac.sh # unsigned here; signing and notarization need your Apple secrets

  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/server/Dockerfile -t notchi-api .
      # secrets and data must never be baked into the image
      - run: docker run --rm --entrypoint sh notchi-api -c '! test -e /app/apps/server/.env && ! test -e /app/apps/server/data.json'
