name: ci
on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: v1.5.1 } # pinned: resolving "latest" kept failing with GitHub 504s
      - run: forge test
        working-directory: contracts

  contracts-near:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: contracts-near }
      # near-workspaces builds the wasm with the cargo-near CLI, then runs the tests on a local NEAR sandbox
      - run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh | sh
      - run: cargo test
        working-directory: contracts-near

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/server/package-lock.json }
      - run: npm ci
        working-directory: apps/server
      - run: npm test
        working-directory: apps/server

  brain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
        working-directory: packages/brain

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck && npm test && npm run build
        working-directory: apps/web

  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build
        working-directory: apps/mac
      - run: ./scripts/release-mac.sh # unsigned here; signing and notarization need your Apple secrets

  api-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/server/Dockerfile -t notchi-api .
      # secrets and data must never be baked into the image
      - run: docker run --rm --entrypoint sh notchi-api -c '! test -e /app/apps/server/.env && ! test -e /app/apps/server/data.json'
