# fly launch --no-deploy --copy-config  (then edit `app`), fly volumes create notchi_data --size 1 --region bom
app = "notchi-api"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "notchi_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # the settlement and refund worker must keep running
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
