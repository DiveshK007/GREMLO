# Deploy from the repo root (the image needs packages/brain): fly deploy . -c apps/server/fly.toml --dockerfile apps/server/Dockerfile
app = "gremlo-api"   # Fly app names are global: change it if taken
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "gremlo_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"   # the settlement and refund worker must keep running
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
